[project]
name = "faceless"
version = "0.1.0"
description = "Faceless Video Factory Backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno[tools,mistral]>=2.5.2",
    "fastapi>=0.129.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faceless"]

[tool.uv]
package = true
